name: 构建 EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install pyinstaller pandas openpyxl

      - name: 打包为 EXE
        run: |
          pyinstaller --onefile --name 光功率检查 光功率检查.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 光功率检查-exe
          path: dist/光功率检查.exe
